<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TapX</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101114;
    color: white;
}

.app {
    max-width: 480px;
    min-height: 100vh;
    margin: auto;
    padding: 20px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 28px;
    font-weight: bold;
}

.profile-button {
    border: 0;
    border-radius: 50%;
    width: 48px;
    height: 48px;
    font-size: 22px;
    cursor: pointer;
}

.balance {
    text-align: center;
    margin-top: 50px;
}

.balance-title {
    color: #aaa;
}

.balance-value {
    font-size: 46px;
    font-weight: bold;
    margin-top: 8px;
}

.tap-button {
    display: block;
    width: 220px;
    height: 220px;
    margin: 45px auto;
    border: 0;
    border-radius: 50%;
    font-size: 32px;
    font-weight: bold;
    cursor: pointer;
}

.tap-button:active {
    transform: scale(.95);
}

.card {
    background: #1b1d22;
    border-radius: 18px;
    padding: 18px;
    margin-top: 15px;
}

input {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: 0;
    border-radius: 10px;
    background: #292c33;
    color: white;
    font-size: 16px;
}

button.action {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border: 0;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}

.close {
    float: right;
    cursor: pointer;
    font-size: 22px;
}

.message {
    text-align: center;
    margin-top: 12px;
    min-height: 20px;
}

.hidden {
    display: none;
}

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 15px;
}

.modal-box {
    width: 100%;
    max-width: 480px;
    max-height: 90vh;
    overflow-y: auto;
    background: #17191e;
    border-radius: 22px;
    padding: 20px;
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="logo">TapX</div>

        <button class="profile-button" onclick="openProfile()">
            👤
        </button>
    </div>

    <div class="balance">
        <div class="balance-title">Ваш баланс</div>
        <div id="balance" class="balance-value">0</div>
        <div>💰 монет</div>
    </div>

    <button class="tap-button" onclick="tapCoin()">
        TAP
    </button>

</div>


<!-- ПРОФИЛЬ -->
<div id="profileModal" class="modal hidden">

    <div class="modal-box">

        <span class="close" onclick="closeProfile()">✕</span>

        <h2>👤 Профиль</h2>

        <div class="card">
            <div>ID пользователя:</div>
            <b id="myId">—</b>
        </div>


        <!-- ПЕРЕВОД -->
        <div class="card">

            <h3>💸 Перевод монет</h3>

            <input
                id="receiverId"
                type="text"
                placeholder="ID получателя"
            >

            <input
                id="transferAmount"
                type="number"
                min="1"
                placeholder="Количество монет"
            >

            <button
                class="action"
                onclick="handleTransfer()"
            >
                💰 Перевести
            </button>

            <div id="transferMessage" class="message"></div>

        </div>


        <!-- ПРОМОКОД -->
        <div class="card">

            <h3>🎁 Промокод</h3>

            <input
                id="promoCode"
                type="text"
                placeholder="Введите промокод"
            >

            <button
                class="action"
                onclick="activatePromo()"
            >
                Активировать
            </button>

            <div id="promoMessage" class="message"></div>

        </div>

    </div>
</div>


<script>

/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL = "ВСТАВЬ_СЮДА_SUPABASE_URL";

const SUPABASE_ANON_KEY = "ВСТАВЬ_СЮДА_SUPABASE_ANON_KEY";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =====================================================
   TELEGRAM
   ===================================================== */

const tg = window.Telegram
    ? window.Telegram.WebApp
    : null;

if (tg) {
    tg.ready();
    tg.expand();
}


/* =====================================================
   СОСТОЯНИЕ
   ===================================================== */

let currentUser = null;


/* =====================================================
   ПОЛУЧЕНИЕ ПОЛЬЗОВАТЕЛЯ
   ===================================================== */

async function loadUser() {

    const {
        data: {
            user
        }
    } = await supabaseClient.auth.getUser();

    currentUser = user;

    if (user) {

        document.getElementById("myId")
            .textContent = user.id;

        await loadBalance();

    } else {

        document.getElementById("myId")
            .textContent = "Не авторизован";

    }
}


/* =====================================================
   БАЛАНС
   ===================================================== */

async function loadBalance() {

    if (!currentUser) return;

    const {
        data,
        error
    } = await supabaseClient.rpc(
        "get_tapx_balance"
    );

    if (error) {

        console.error(error);

        return;
    }

    document.getElementById("balance")
        .textContent = Number(data || 0).toLocaleString();
}


/* =====================================================
   ТАП
   ===================================================== */

async function tapCoin() {

    if (!currentUser) {

        alert("Пользователь не авторизован");

        return;
    }

    /*
       Здесь оставлен локальный пример.
       Если в твоём TapX уже есть настоящая
       функция начисления монет, её нужно
       использовать вместо этого участка.
    */

    const {
        data,
        error
    } = await supabaseClient
        .from("tapx_users")
        .select("coins")
        .eq("id", currentUser.id)
        .single();

    if (error) {

        console.error(error);

        return;
    }

    const newBalance =
        Number(data.coins || 0) + 1;

    const update =
        await supabaseClient
            .from("tapx_users")
            .update({
                coins: newBalance
            })
            .eq("id", currentUser.id);

    if (update.error) {

        console.error(update.error);

        return;
    }

    await loadBalance();
}


/* =====================================================
   ОТКРЫТЬ ПРОФИЛЬ
   ===================================================== */

function openProfile() {

    document
        .getElementById("profileModal")
        .classList.remove("hidden");

    loadBalance();
}


/* =====================================================
   ЗАКРЫТЬ ПРОФИЛЬ
   ===================================================== */

function closeProfile() {

    document
        .getElementById("profileModal")
        .classList.add("hidden");
}


/* =====================================================
   ПЕРЕВОД МОНЕТ
   ===================================================== */

async function handleTransfer() {

    const receiverId =
        document
            .getElementById("receiverId")
            .value
            .trim();

    const amount =
        Number(
            document
                .getElementById("transferAmount")
                .value
        );

    const message =
        document.getElementById(
            "transferMessage"
        );


    message.textContent = "";


    if (!receiverId) {

        message.textContent =
            "❌ Введите ID получателя";

        return;
    }


    if (!Number.isInteger(amount) || amount <= 0) {

        message.textContent =
            "❌ Введите правильную сумму";

        return;
    }


    if (!currentUser) {

        message.textContent =
            "❌ Пользователь не авторизован";

        return;
    }


    message.textContent =
        "⏳ Выполняем перевод...";


    const {
        data,
        error
    } = await supabaseClient.rpc(
        "transfer_coins",
        {
            p_receiver_id: receiverId,
            p_amount: amount
        }
    );


    if (error) {

        console.error(error);

        message.textContent =
            "❌ " + error.message;

        return;
    }


    if (!data || data.success !== true) {

        message.textContent =
            "❌ Перевод не выполнен";

        return;
    }


    message.textContent =
        "✅ Перевод успешно выполнен!";


    document
        .getElementById("receiverId")
        .value = "";

    document
        .getElementById("transferAmount")
        .value = "";


    await loadBalance();
}


/* =====================================================
   ПРОМОКОД
   ===================================================== */

async function activatePromo() {

    const code =
        document
            .getElementById("promoCode")
            .value
            .trim()
            .toUpperCase();

    const message =
        document.getElementById(
            "promoMessage"
        );


    if (!code) {

        message.textContent =
            "❌ Введите промокод";

        return;
    }


    /*
       Здесь вызывается функция Supabase.
       Если функция ещё не создана,
       промокоды пока не будут работать.
    */

    const {
        data,
        error
    } = await supabaseClient.rpc(
        "activate_promo",
        {
            p_code: code
        }
    );


    if (error) {

        console.error(error);

        message.textContent =
            "❌ " + error.message;

        return;
    }


    if (!data || data.success !== true) {

        message.textContent =
            "❌ Промокод не активирован";

        return;
    }


    message.textContent =
        "🎉 Промокод активирован!";


    document
        .getElementById("promoCode")
        .value = "";


    await loadBalance();
}


/* =====================================================
   ЗАПУСК
   ===================================================== */

loadUser();

</script>

</body>
          </html>
