<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TapX</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #191b2a, #090a10);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px 20px;
    }

    .title {
      font-size: 28px;
      font-weight: bold;
    }

    .balance {
      font-size: 42px;
      font-weight: bold;
      margin: 25px 0;
    }

    .coin {
      width: 210px;
      height: 210px;
      border-radius: 50%;
      border: none;
      background: #f5b942;
      font-size: 90px;
      box-shadow: 0 10px 30px rgba(245,185,66,.35);
      cursor: pointer;
    }

    .coin:active {
      transform: scale(.92);
    }

    .energy {
      margin-top: 30px;
      font-size: 18px;
    }

    .energy-bar {
      height: 14px;
      background: #333;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 10px;
    }

    .energy-fill {
      height: 100%;
      width: 100%;
      background: #4caf50;
    }
  </style>
</head>

<body>

  <div class="title">⚡ TapX</div>

  <p id="username">Игрок</p>

  <div class="balance">
    🪙 <span id="balance">0</span>
  </div>

  <button class="coin" id="coin">🪙</button>

  <div class="energy">
    ⚡ <span id="energy">1000</span> / 1000

    <div class="energy-bar">
      <div class="energy-fill" id="energyFill"></div>
    </div>
  </div>

<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

const user = tg.initDataUnsafe?.user;

if (user) {
  document.getElementById("username").innerText =
    "👋 " + (user.first_name || "Игрок");
}

let balance = Number(localStorage.getItem("balance")) || 0;
let energy = Number(localStorage.getItem("energy")) || 1000;

const maxEnergy = 1000;

const balanceElement = document.getElementById("balance");
const energyElement = document.getElementById("energy");
const energyFill = document.getElementById("energyFill");
const coinButton = document.getElementById("coin");

function updateScreen() {

  balanceElement.innerText = balance;
  energyElement.innerText = energy;

  energyFill.style.width =
    (energy / maxEnergy * 100) + "%";
}

coinButton.addEventListener("click", () => {

  if (energy <= 0) return;

  balance++;
  energy--;

  localStorage.setItem("balance", balance);
  localStorage.setItem("energy", energy);

  if (tg.HapticFeedback) {
    tg.HapticFeedback.impactOccurred("light");
  }

  updateScreen();
});

setInterval(() => {

  if (energy < maxEnergy) {
    energy++;

    localStorage.setItem("energy", energy);

    updateScreen();
  }

}, 1000);

updateScreen();

</script>

</body>
</html>
