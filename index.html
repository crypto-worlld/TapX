<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>TapX</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:#080b12;
    color:white;
    font-family:Arial,sans-serif;
    overflow-x:hidden;
}

button{
    border:0;
    cursor:pointer;
}

.app{
    max-width:500px;
    min-height:100vh;
    margin:auto;
    padding:18px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.logo{
    font-size:28px;
    font-weight:900;
}

.profile-btn{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#171d2a;
    color:white;
    font-size:22px;
}

.balance{
    text-align:center;
    margin-top:30px;
}

.balance-title{
    color:#8992a5;
    font-size:14px;
}

.balance-value{
    font-size:45px;
    font-weight:900;
    margin-top:8px;
}

.coin{
    font-size:22px;
}

.tap-area{
    display:flex;
    justify-content:center;
    align-items:center;
    margin:35px 0;
}

.tap-button{
    width:220px;
    height:220px;
    border-radius:50%;
    background:linear-gradient(145deg,#25a7ff,#635bff);
    box-shadow:0 0 50px rgba(45,130,255,.35);
    color:white;
    font-size:45px;
    font-weight:900;
    transition:.08s;
}

.tap-button:active{
    transform:scale(.94);
}

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.card{
    background:#111722;
    border-radius:18px;
    padding:18px;
}

.card-title{
    color:#8992a5;
    font-size:13px;
}

.card-value{
    margin-top:7px;
    font-size:21px;
    font-weight:bold;
}

.actions{
    display:grid;
    gap:10px;
    margin-top:20px;
}

.action{
    width:100%;
    padding:16px;
    border-radius:15px;
    background:#171e2b;
    color:white;
    font-size:16px;
    font-weight:bold;
}

.action:hover{
    background:#202a3b;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:100;
}

.modal.active{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:500px;
    background:#111722;
    border-radius:25px 25px 0 0;
    padding:22px;
    max-height:90vh;
    overflow:auto;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.modal-title{
    font-size:23px;
    font-weight:bold;
}

.close{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#202837;
    color:white;
    font-size:20px;
}

.input{
    width:100%;
    padding:15px;
    margin-top:10px;
    border-radius:12px;
    border:1px solid #2b3548;
    background:#0b1019;
    color:white;
    font-size:16px;
    outline:none;
}

.primary{
    width:100%;
    padding:16px;
    margin-top:12px;
    border-radius:13px;
    background:#286cff;
    color:white;
    font-size:16px;
    font-weight:bold;
}

.profile-info{
    background:#0b1019;
    padding:16px;
    border-radius:15px;
    margin-bottom:15px;
}

.info-row{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
}

.label{
    color:#8992a5;
}

.message{
    margin-top:12px;
    padding:12px;
    border-radius:10px;
    display:none;
}

.success{
    background:#12351f;
    color:#5cff91;
}

.error{
    background:#3a1515;
    color:#ff7777;
}

.section{
    margin-top:20px;
}

.section-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
}

.loading{
    opacity:.6;
    pointer-events:none;
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="logo">TapX</div>

        <button class="profile-btn" onclick="openProfile()">
            👤
        </button>
    </div>

    <div class="balance">
        <div class="balance-title">Ваш баланс</div>

        <div class="balance-value">
            <span id="balance">0</span>
            <span class="coin">🪙</span>
        </div>
    </div>

    <div class="tap-area">
        <button class="tap-button" id="tapButton" onclick="tapCoin()">
            TAP
        </button>
    </div>

    <div class="stats">

        <div class="card">
            <div class="card-title">Всего тапов</div>
            <div class="card-value" id="taps">0</div>
        </div>

        <div class="card">
            <div class="card-title">Ваш ID</div>
            <div class="card-value" id="userId">—</div>
        </div>

    </div>

    <div class="actions">

        <button class="action" onclick="openTransfer()">
            💸 Перевести монеты
        </button>

        <button class="action" onclick="openPromo()">
            🎁 Промокод
        </button>

        <button class="action" onclick="openWallet()">
            💎 TON Кошелёк
        </button>

    </div>

</div>


<!-- PROFILE -->

<div class="modal" id="profileModal">

    <div class="modal-box">

        <div class="modal-header">
            <div class="modal-title">Профиль</div>

            <button class="close" onclick="closeModal('profileModal')">
                ×
            </button>
        </div>

        <div class="profile-info">

            <div class="info-row">
                <span class="label">Имя</span>
                <span id="profileName">—</span>
            </div>

            <div class="info-row">
                <span class="label">Telegram ID</span>
                <span id="profileTelegramId">—</span>
            </div>

            <div class="info-row">
                <span class="label">Игровой ID</span>
                <span id="profileGameId">—</span>
            </div>

            <div class="info-row">
                <span class="label">Монеты</span>
                <span id="profileCoins">0</span>
            </div>

        </div>

        <button class="action" onclick="openTransfer()">
            💸 Перевод монет
        </button>

        <button class="action" onclick="openPromo()">
            🎁 Активировать промокод
        </button>

        <button class="action" onclick="openWallet()">
            💎 TON Кошелёк
        </button>

    </div>

</div>


<!-- TRANSFER -->

<div class="modal" id="transferModal">

    <div class="modal-box">

        <div class="modal-header">

            <div class="modal-title">
                Перевод монет
            </div>

            <button class="close" onclick="closeModal('transferModal')">
                ×
            </button>

        </div>

        <div class="card">
            <div class="card-title">
                Ваш баланс
            </div>

            <div class="card-value">
                <span id="transferBalance">0</span> 🪙
            </div>
        </div>

        <input
            class="input"
            id="receiverId"
            placeholder="ID получателя"
            inputmode="text"
        >

        <input
            class="input"
            id="transferAmount"
            placeholder="Количество монет"
            type="number"
            min="1"
            inputmode="numeric"
        >

        <button class="primary" onclick="sendCoins()">
            Перевести
        </button>

        <div id="transferMessage" class="message"></div>

    </div>

</div>


<!-- PROMO -->

<div class="modal" id="promoModal">

    <div class="modal-box">

        <div class="modal-header">

            <div class="modal-title">
                Промокод
            </div>

            <button class="close" onclick="closeModal('promoModal')">
                ×
            </button>

        </div>

        <input
            class="input"
            id="promoCode"
            placeholder="Введите промокод"
            autocomplete="off"
        >

        <button class="primary" onclick="activatePromo()">
            Активировать
        </button>

        <div id="promoMessage" class="message"></div>

    </div>

</div>


<!-- WALLET -->

<div class="modal" id="walletModal">

    <div class="modal-box">

        <div class="modal-header">

            <div class="modal-title">
                TON Кошелёк
            </div>

            <button class="close" onclick="closeModal('walletModal')">
                ×
            </button>

        </div>

        <p style="color:#8992a5">
            Подключите TON-кошелёк через TON Connect.
        </p>

        <div id="ton-connect"></div>

        <div class="section">

            <div class="section-title">
                Ваш адрес
            </div>

            <div
                id="walletAddress"
                class="profile-info"
                style="word-break:break-all"
            >
                Кошелёк не подключён
            </div>

        </div>

    </div>

</div>


<script>

/* =========================================================
   НАСТРОЙКИ SUPABASE
   ========================================================= */

const SUPABASE_URL = "ВСТАВЬ_СЮДА_URL_ТВОЕГО_SUPABASE";

const SUPABASE_ANON_KEY = "ВСТАВЬ_СЮДА_ANON_KEY_ТВОЕГО_SUPABASE";


const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* =========================================================
   TELEGRAM
   ========================================================= */

const tg = window.Telegram?.WebApp;

if(tg){

    tg.ready();

    tg.expand();

}


/* =========================================================
   ДАННЫЕ ПОЛЬЗОВАТЕЛЯ
   ========================================================= */

let currentUser = null;

let localBalance = 0;

let localTaps = 0;


/* =========================================================
   TON CONNECT
   ========================================================= */

let tonConnectUI = null;

try{

    tonConnectUI = new TON_CONNECT_UI.TonConnectUI({

        manifestUrl:
        window.location.origin +
        "/tonconnect-manifest.json",

        buttonRootId:"ton-connect"

    });

    tonConnectUI.onStatusChange(wallet => {

        if(wallet){

            const address =
                wallet.account?.address || "";

            document.getElementById(
                "walletAddress"
            ).textContent =
                address || "Кошелёк подключён";

        }else{

            document.getElementById(
                "walletAddress"
            ).textContent =
                "Кошелёк не подключён";

        }

    });

}catch(error){

    console.error(
        "TON Connect:",
        error
    );

}


/* =========================================================
   ПОЛУЧЕНИЕ TELEGRAM ПОЛЬЗОВАТЕЛЯ
   ========================================================= */

function getTelegramUser(){

    if(
        tg &&
        tg.initDataUnsafe &&
        tg.initDataUnsafe.user
    ){

        return tg.initDataUnsafe.user;

    }

    return null;

}


/* =========================================================
   ЗАГРУЗКА ПОЛЬЗОВАТЕЛЯ
   ========================================================= */

async function loadUser(){

    const telegramUser =
        getTelegramUser();

    if(!telegramUser){

        document.getElementById(
            "userId"
        ).textContent =
        "TEST";

        return;

    }

    currentUser = telegramUser;

    document.getElementById(
        "userId"
    ).textContent =
    telegramUser.id;

    document.getElementById(
        "profileName"
    ).textContent =
    (
        telegramUser.first_name || ""
    ) +
    " " +
    (
        telegramUser.last_name || ""
    );

    document.getElementById(
        "profileTelegramId"
    ).textContent =
    telegramUser.id;

    /*
       Здесь используется RPC/таблица Supabase.
       После установки SQL ниже пользователь
       автоматически появится в базе.
    */

    try{

        const {data,error} =
        await supabaseClient.rpc(
            "get_or_create_tapx_user",
            {
                p_telegram_id:
                String(telegramUser.id),

                p_username:
                telegramUser.username || null,

                p_first_name:
                telegramUser.first_name || null,

                p_last_name:
                telegramUser.last_name || null
            }
        );

        if(error){

            console.error(error);

            return;

        }

        if(data){

            localBalance =
            Number(data.coins || 0);

            document.getElementById(
                "profileGameId"
            ).textContent =
            data.id || "—";

            updateBalance();

        }

    }catch(error){

        console.error(error);

    }

}


/* =========================================================
   БАЛАНС
   ========================================================= */

function updateBalance(){

    document.getElementById(
        "balance"
    ).textContent =
    localBalance;

    document.getElementById(
        "profileCoins"
    ).textContent =
    localBalance;

    document.getElementById(
        "transferBalance"
    ).textContent =
    localBalance;

}


/* =========================================================
   TAP
   ========================================================= */

async function tapCoin(){

    localBalance++;

    localTaps++;

    document.getElementById(
        "taps"
    ).textContent =
    localTaps;

    updateBalance();

    /*
       В дальнейшем можно подключить
       серверную защиту от накрутки тапов.
    */

}


/* =========================================================
   ПРОФИЛЬ
   ========================================================= */

function openProfile(){

    openModal(
        "profileModal"
    );

}


/* =========================================================
   ПЕРЕВОД
   ========================================================= */

function openTransfer(){

    closeModal(
        "profileModal"
    );

    openModal(
        "transferModal"
    );

}


async function sendCoins(){

    const receiverId =
        document
        .getElementById(
            "receiverId"
        )
        .value
        .trim();

    const amount =
        Number(
            document
            .getElementById(
                "transferAmount"
            )
            .value
        );

    const message =
        document.getElementById(
            "transferMessage"
        );

    message.style.display =
        "none";

    if(!receiverId){

        showMessage(
            message,
            "Введите ID получателя",
            false
        );

        return;

    }

    if(
        !Number.isInteger(amount) ||
        amount <= 0
    ){

        showMessage(
            message,
            "Введите корректную сумму",
            false
        );

        return;

    }

    try{

        const {data,error} =
        await supabaseClient.rpc(
            "transfer_coins",
            {
                p_receiver_id:
                    receiverId,

                p_amount:
                    amount
            }
        );

        if(error){

            throw error;

        }

        if(
            data &&
            data.success === true
        ){

            localBalance -= amount;

            updateBalance();

            showMessage(
                message,
                "Перевод выполнен успешно!",
                true
            );

            document.getElementById(
                "receiverId"
            ).value = "";

            document.getElementById(
                "transferAmount"
            ).value = "";

        }else{

            throw new Error(
                "Перевод не выполнен"
            );

        }

    }catch(error){

        console.error(error);

        showMessage(
            message,
            error.message ||
            "Ошибка перевода",
            false
        );

    }

}


/* =========================================================
   ПРОМОКОД
   ========================================================= */

function openPromo(){

    closeModal(
        "profileModal"
    );

    openModal(
        "promoModal"
    );

}


async function activatePromo(){

    const code =
        document
        .getElementById(
            "promoCode"
        )
        .value
        .trim()
        .toUpperCase();

    const message =
        document.getElementById(
            "promoMessage"
        );

    if(!code){

        showMessage(
            message,
            "Введите промокод",
            false
        );

        return;

    }

    try{

        const {data,error} =
        await supabaseClient.rpc(
            "activate_promo",
            {
                p_code:code
            }
        );

        if(error){

            throw error;

        }

        if(
            data &&
            data.success === true
        ){

            const reward =
                Number(
                    data.reward || 0
                );

            localBalance +=
                reward;

            updateBalance();

            showMessage(
                message,
                "Промокод активирован! +" +
                reward +
                " 🪙",
                true
            );

            document.getElementById(
                "promoCode"
            ).value = "";

        }else{

            throw new Error(
                data?.message ||
                "Промокод недействителен"
            );

        }

    }catch(error){

        console.error(error);

        showMessage(
            message,
            error.message ||
            "Ошибка промокода",
            false
        );

    }

}


/* =========================================================
   TON
   ========================================================= */

function openWallet(){

    closeModal(
        "profileModal"
    );

    openModal(
        "walletModal"
    );

}


/* =========================================================
   MODALS
   ========================================================= */

function openModal(id){

    document
    .getElementById(id)
    .classList
    .add("active");

}


function closeModal(id){

    document
    .getElementById(id)
    .classList
    .remove("active");

}


document
.querySelectorAll(".modal")
.forEach(modal => {

    modal.addEventListener(
        "click",
        event => {

            if(
                event.target === modal
            ){

                modal.classList.remove(
                    "active"
                );

            }

        }
    );

});


/* =========================================================
   СООБЩЕНИЯ
   ========================================================= */

function showMessage(
    element,
    text,
    success
){

    element.textContent =
        text;

    element.className =
        "message " +
        (
            success
            ? "success"
            : "error"
        );

    element.style.display =
        "block";

}


/* =========================================================
   START
   ========================================================= */

loadUser();

updateBalance();

</script>

</body>
            </html>
